[package]
name = "glean"
version = "0.1.0"
edition = "2021"
description = "Track which files changed since a tool last processed them — incremental work for loops, CI, and agents."
authors = ["Alexandre Malucelli <alexandre@malucelli.net>"]
license = "MIT"
repository = "https://github.com/amalucelli/glean"
homepage = "https://github.com/amalucelli/glean"
readme = "README.md"
keywords = ["git", "incremental", "watch", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "glean"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
