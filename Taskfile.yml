# https://taskfile.dev
version: "3"
silent: true

tasks:
  build:
    desc: Build the release binary
    cmds:
      - cargo build --release

  install:
    desc: Install glean to ~/.cargo/bin
    cmds:
      - cargo install --path . --root ~/.local

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt

  lint:
    desc: Lint with clippy
    cmds:
      - cargo clippy --all-targets -- -D warnings

  test:
    desc: Run the test suite
    cmds:
      - cargo test

  check:
    desc: Format check, lint, and test
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test

  snapshot:
    desc: Build the release artifacts locally without tagging or publishing
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  release:
    desc: Tag and publish a release, e.g. task release TAG=v0.1.0
    requires:
      vars: [TAG]
    env:
      GITHUB_TOKEN:
        sh: gh auth token
    cmds:
      # goreleaser reads the tag from the remote, so it has to be pushed first.
      - git tag -a {{.TAG}} -m {{.TAG}}
      - git push --follow-tags
      - goreleaser release --clean
